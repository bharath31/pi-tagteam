<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" style="background:#080c14;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'JetBrains Mono',monospace;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>

    <linearGradient id="claudeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <linearGradient id="piGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="cyanBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.3" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Pattern -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="640" fill="url(#bgGlow)" />
  <rect width="1280" height="640" fill="url(#grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="280" cy="320" r="220" fill="#ea580c" opacity="0.08" filter="url(#glow)" />
  <circle cx="1000" cy="320" r="220" fill="#f59e0b" opacity="0.08" filter="url(#glow)" />
  <circle cx="640" cy="340" r="160" fill="#38bdf8" opacity="0.06" filter="url(#glow)" />

  <!-- Top Header Section -->
  <g transform="translate(60, 48)">
    <!-- Package Badge -->
    <rect x="0" y="0" width="130" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="12" cy="13" r="4" fill="#38bdf8" filter="url(#softGlow)" />
    <text x="24" y="17" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">PI-PACKAGE</text>

    <!-- Version Badge -->
    <rect x="138" y="0" width="60" height="26" rx="6" fill="#172554" stroke="#1e40af" stroke-width="1" />
    <text x="148" y="17" fill="#60a5fa" font-size="11" font-weight="700">v0.1.0</text>

    <!-- Main Title -->
    <text x="0" y="68" fill="#f8fafc" font-size="38" font-weight="900" letter-spacing="-1">
      pi-tagteam <tspan fill="#f59e0b">🤝</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="96" fill="#94a3b8" font-size="15" font-weight="400">
      Tag Pi in when Claude Code or Codex hits limits. Zero-waste session &amp; worktree handoff.
    </text>
  </g>

  <!-- Quick Install pill (Top Right) -->
  <g transform="translate(860, 48)">
    <rect x="0" y="0" width="360" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="16" y="26" fill="#64748b" font-size="13" font-weight="600">$</text>
    <text x="32" y="26" fill="#38bdf8" font-size="13" font-weight="600">pi install npm:pi-tagteam</text>
    <rect x="294" y="8" width="54" height="26" rx="4" fill="#1e293b" />
    <text x="306" y="25" fill="#cbd5e1" font-size="11" font-weight="600">COPY</text>
  </g>

  <!-- ================= DUAL CHAMBER RELAY DISPLAY ================= -->

  <!-- LEFT PANE: CLAUDE CODE / CODEX (STALLED) -->
  <g transform="translate(60, 180)">
    <!-- Terminal Window Frame -->
    <rect width="480" height="400" rx="12" fill="#0c1220" stroke="#ef4444" stroke-opacity="0.35" stroke-width="1.5" />
    <rect width="480" height="36" rx="12" fill="#11192d" />
    <rect y="24" width="480" height="12" fill="#11192d" />

    <!-- Window Dots -->
    <circle cx="20" cy="18" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="36" cy="18" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="52" cy="18" r="5" fill="#10b981" opacity="0.8" />

    <!-- Tab Title -->
    <text x="72" y="22" fill="#94a3b8" font-size="12" font-weight="600">claude-code — session: f4fca288</text>
    
    <!-- Status Tag -->
    <rect x="360" y="8" width="108" height="20" rx="4" fill="#7f1d1d" />
    <text x="368" y="22" fill="#fca5a5" font-size="10" font-weight="700">⚠️ LIMIT HIT</text>

    <!-- Terminal Content -->
    <g transform="translate(20, 56)">
      <!-- Prompt -->
      <text x="0" y="14" fill="#64748b" font-size="11">PROMPT</text>
      <text x="0" y="32" fill="#e2e8f0" font-size="12" font-weight="600">"Fix durable audit reports &amp; recovery storage in PR #45"</text>

      <!-- Divider -->
      <line x1="0" y1="48" x2="440" y2="48" stroke="#1e293b" stroke-width="1" />

      <!-- Subagents section -->
      <text x="0" y="70" fill="#64748b" font-size="11">IN-FLIGHT SUBAGENTS (2 STALLED)</text>
      
      <rect x="0" y="80" width="440" height="32" rx="6" fill="#1e1b2e" stroke="#581c87" stroke-width="1" />
      <text x="12" y="100" fill="#c084fc" font-size="11">🤖 agent-a5167</text>
      <text x="130" y="100" fill="#94a3b8" font-size="11">Durable audit reports</text>
      <text x="375" y="100" fill="#f87171" font-size="10" font-weight="700">[PAUSED]</text>

      <rect x="0" y="118" width="440" height="32" rx="6" fill="#1e1b2e" stroke="#581c87" stroke-width="1" />
      <text x="12" y="138" fill="#c084fc" font-size="11">🤖 agent-afd3e</text>
      <text x="130" y="138" fill="#94a3b8" font-size="11">Recovery rate storage</text>
      <text x="375" y="138" fill="#f87171" font-size="10" font-weight="700">[PAUSED]</text>

      <!-- Uncommitted worktree alert -->
      <text x="0" y="176" fill="#64748b" font-size="11">UNCOMMITTED WORKTREE CHANGES</text>
      <rect x="0" y="186" width="440" height="64" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <text x="12" y="206" fill="#eab308" font-size="11">📁 .claude/worktrees/agent-afd3e361dfa64</text>
      <text x="24" y="224" fill="#94a3b8" font-size="11">M src/storage/postgres.ts  ·  +1411 / -244</text>
      <text x="24" y="240" fill="#4ade80" font-size="11">+ migrations/0009_recovery_events.sql</text>

      <!-- Limit Error Banner -->
      <rect x="0" y="266" width="440" height="58" rx="8" fill="#450a0a" stroke="#991b1b" stroke-width="1" />
      <text x="14" y="290" fill="#fca5a5" font-size="12" font-weight="700">⚠️ Session limit reached</text>
      <text x="14" y="308" fill="#f87171" font-size="11">Usage cap reached. Resets at 1:40 PM. Process stopped.</text>
    </g>
  </g>


  <!-- CENTER: RELAY CONDUIT / BATON PASS -->
  <g transform="translate(565, 260)">
    <!-- Conduit Line -->
    <line x1="0" y1="120" x2="150" y2="120" stroke="url(#cyanBeam)" stroke-width="4" filter="url(#softGlow)" />
    
    <!-- Central Baton Hexagon -->
    <g transform="translate(75, 120)">
      <circle cx="0" cy="0" r="32" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#softGlow)" />
      <text x="-16" y="8" font-size="24">🤝</text>
    </g>

    <!-- Transferred Payload Pills -->
    <g transform="translate(10, 40)">
      <rect x="0" y="0" width="130" height="24" rx="12" fill="#0369a1" fill-opacity="0.4" stroke="#0284c7" stroke-width="1" />
      <text x="12" y="16" fill="#bae6fd" font-size="10" font-weight="700">⚡ 11 DIRTY FILES</text>
    </g>

    <g transform="translate(10, 180)">
      <rect x="0" y="0" width="130" height="24" rx="12" fill="#0369a1" fill-opacity="0.4" stroke="#0284c7" stroke-width="1" />
      <text x="12" y="16" fill="#bae6fd" font-size="10" font-weight="700">⚡ 2 SUBAGENTS</text>
    </g>

    <!-- Arrow Indicators -->
    <path d="M 125 114 L 138 120 L 125 126" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>


  <!-- RIGHT PANE: PI (ACTIVE / RESUMED) -->
  <g transform="translate(740, 180)">
    <!-- Terminal Window Frame -->
    <rect width="480" height="400" rx="12" fill="#0c1220" stroke="#f59e0b" stroke-opacity="0.45" stroke-width="1.5" />
    <rect width="480" height="36" rx="12" fill="#11192d" />
    <rect y="24" width="480" height="12" fill="#11192d" />

    <!-- Window Dots -->
    <circle cx="20" cy="18" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="36" cy="18" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="52" cy="18" r="5" fill="#10b981" opacity="0.8" />

    <!-- Tab Title -->
    <text x="72" y="22" fill="#f59e0b" font-size="12" font-weight="700">pi — active turn</text>
    
    <!-- Status Tag -->
    <rect x="350" y="8" width="118" height="20" rx="4" fill="#78350f" />
    <text x="358" y="22" fill="#fde68a" font-size="10" font-weight="700">⚡ TAGGED IN: PI</text>

    <!-- Terminal Content -->
    <g transform="translate(20, 56)">
      <!-- Command Executed -->
      <text x="0" y="14" fill="#64748b" font-size="11">COMMAND</text>
      <rect x="0" y="22" width="440" height="28" rx="6" fill="#1e293b" />
      <text x="12" y="41" fill="#38bdf8" font-size="12" font-weight="700">/tagteam latest</text>

      <!-- Handoff Ingest Result -->
      <g transform="translate(0, 64)">
        <text x="0" y="14" fill="#10b981" font-size="11" font-weight="700">✓ HANDOFF BRIEF INGESTED</text>
        <rect x="0" y="22" width="440" height="144" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />

        <text x="14" y="44" fill="#fbbf24" font-size="11" font-weight="700">## 🤝 Tag-Team Handoff from Claude Code</text>
        <text x="14" y="64" fill="#cbd5e1" font-size="11">✓ Ingested goal: "Fix durable reports in PR #45"</text>
        <text x="14" y="84" fill="#cbd5e1" font-size="11">✓ Salvaged worktree: agent-afd3e361dfa64</text>
        <text x="14" y="104" fill="#cbd5e1" font-size="11">✓ Reconnected 2 subagent execution goals</text>
        <text x="14" y="124" fill="#cbd5e1" font-size="11">✓ Loaded 11 modified files into active context</text>
        <text x="14" y="146" fill="#38bdf8" font-size="11">⚡ Zero tokens wasted · Context intact</text>
      </g>

      <!-- Active Execution Stream -->
      <g transform="translate(0, 246)">
        <text x="0" y="14" fill="#64748b" font-size="11">CURRENT PI AGENT TURN</text>
        <rect x="0" y="22" width="440" height="60" rx="8" fill="#064e3b" fill-opacity="0.3" stroke="#059669" stroke-width="1" />
        <text x="14" y="44" fill="#6ee7b7" font-size="11" font-weight="600">pi: "Applying migration and finishing recovery routes..."</text>
        <text x="14" y="64" fill="#a7f3d0" font-size="11">Running tests: 238/238 passing (100% green)</text>
      </g>
    </g>
  </g>

  <!-- Bottom Badges Bar -->
  <g transform="translate(60, 600)">
    <text x="0" y="0" fill="#64748b" font-size="11">SUPPORTS:</text>
    
    <rect x="75" y="-14" width="95" height="20" rx="4" fill="#1e293b" />
    <text x="83" y="0" fill="#e06c4b" font-size="10" font-weight="700">Claude Code</text>

    <rect x="178" y="-14" width="105" height="20" rx="4" fill="#1e293b" />
    <text x="186" y="0" fill="#10a37f" font-size="10" font-weight="700">OpenAI Codex</text>

    <rect x="291" y="-14" width="105" height="20" rx="4" fill="#1e293b" />
    <text x="299" y="0" fill="#f59e0b" font-size="10" font-weight="700">Git Worktrees</text>

    <rect x="404" y="-14" width="95" height="20" rx="4" fill="#1e293b" />
    <text x="412" y="0" fill="#c084fc" font-size="10" font-weight="700">Subagents</text>

    <rect x="507" y="-14" width="85" height="20" rx="4" fill="#1e293b" />
    <text x="515" y="0" fill="#38bdf8" font-size="10" font-weight="700">Task Lists</text>

    <!-- Right-aligned stats -->
    <text x="1160" y="0" text-anchor="end" fill="#64748b" font-size="11">MIT License · github.com/bharath31/pi-tagteam</text>
  </g>
</svg>
