<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" style="background:#000000;font-family:-apple-system,BlinkMacSystemFont,'Geist','Inter','Segoe UI',Roboto,sans-serif;">
  <defs>
    <!-- Hairline Grid Pattern -->
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.75" fill="#1f1f1f" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="#000000" />
  <rect width="1280" height="640" fill="url(#dotGrid)" opacity="0.6" />

  <!-- Frame Border -->
  <rect x="0.5" y="0.5" width="1279" height="639" fill="none" stroke="#171717" stroke-width="1" />

  <!-- ================= TOP HEADER ================= -->
  <g transform="translate(64, 56)">
    <!-- Eyebrow Tag -->
    <g transform="translate(0, 0)">
      <rect width="120" height="24" rx="12" fill="#0d0d0d" stroke="#222222" stroke-width="1" />
      <circle cx="12" cy="12" r="3" fill="#ededed" />
      <text x="22" y="15.5" fill="#888888" font-size="10" font-weight="600" letter-spacing="0.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">PI EXTENSION</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="66" fill="#f5f5f5" font-size="34" font-weight="600" letter-spacing="-1">
      pi-tagteam
    </text>

    <!-- Subtitle -->
    <text x="0" y="96" fill="#888888" font-size="15" font-weight="400" letter-spacing="-0.2">
      Pass the baton to Pi when Claude Code or Codex hits rate limits.
    </text>
  </g>

  <!-- Top Right Command Pill -->
  <g transform="translate(936, 56)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <rect width="280" height="40" rx="8" fill="#0a0a0a" stroke="#222222" stroke-width="1" />
    <text x="16" y="24" fill="#555555" font-size="12">$</text>
    <text x="30" y="24" fill="#ededed" font-size="12">pi install npm:pi-tagteam</text>
  </g>

  <!-- ================= DUAL CHAMBER CARDS ================= -->

  <!-- LEFT CARD: SOURCE SESSION (STALLED) -->
  <g transform="translate(64, 184)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <rect width="550" height="380" rx="10" fill="#080808" stroke="#1f1f1f" stroke-width="1" />
    
    <!-- Window Header -->
    <rect width="550" height="40" rx="10" fill="#0e0e0e" />
    <rect y="30" width="550" height="10" fill="#0e0e0e" />
    <line x1="0" y1="40" x2="550" y2="40" stroke="#1a1a1a" stroke-width="1" />

    <circle cx="18" cy="20" r="3.5" fill="#333333" />
    <circle cx="30" cy="20" r="3.5" fill="#333333" />
    <circle cx="42" cy="20" r="3.5" fill="#333333" />

    <text x="60" y="24" fill="#777777" font-size="11">claude-code · session f4fca288</text>
    
    <!-- State badge -->
    <rect x="444" y="10" width="92" height="20" rx="4" fill="#141414" stroke="#262626" stroke-width="1" />
    <text x="454" y="23.5" fill="#888888" font-size="10" font-weight="600">LIMIT PAUSED</text>

    <!-- Content -->
    <g transform="translate(24, 64)">
      <!-- Goal line -->
      <text fill="#555555" font-size="10" letter-spacing="0.5">ORIGINAL TASK</text>
      <text y="20" fill="#e5e5e5" font-size="12">"Fix durable telemetry and audit reports in PR #45"</text>

      <!-- Divider line -->
      <line x1="0" y1="36" x2="502" y2="36" stroke="#171717" stroke-width="1" />

      <!-- Subagents section -->
      <g transform="translate(0, 54)">
        <text fill="#555555" font-size="10" letter-spacing="0.5">SUBAGENTS IN FLIGHT</text>
        
        <g transform="translate(0, 14)">
          <rect width="502" height="28" rx="4" fill="#0d0d0d" stroke="#1a1a1a" stroke-width="1" />
          <text x="12" y="18" fill="#888888" font-size="11">agent-a5167</text>
          <text x="130" y="18" fill="#555555" font-size="11">Durable reports</text>
          <text x="440" y="18" fill="#777777" font-size="10">paused</text>
        </g>

        <g transform="translate(0, 48)">
          <rect width="502" height="28" rx="4" fill="#0d0d0d" stroke="#1a1a1a" stroke-width="1" />
          <text x="12" y="18" fill="#888888" font-size="11">agent-afd3e</text>
          <text x="130" y="18" fill="#555555" font-size="11">Recovery storage</text>
          <text x="440" y="18" fill="#777777" font-size="10">paused</text>
        </g>
      </g>

      <!-- Worktree state -->
      <g transform="translate(0, 150)">
        <text fill="#555555" font-size="10" letter-spacing="0.5">UNCOMMITTED WORKTREE CHANGES</text>
        
        <g transform="translate(0, 14)">
          <rect width="502" height="52" rx="4" fill="#0d0d0d" stroke="#1a1a1a" stroke-width="1" />
          <text x="12" y="20" fill="#888888" font-size="11">.claude/worktrees/agent-afd3e361dfa64</text>
          <text x="12" y="38" fill="#555555" font-size="11">11 files changed · +1411 / -244 lines</text>
        </g>
      </g>

      <!-- Status banner -->
      <g transform="translate(0, 240)">
        <rect width="502" height="38" rx="4" fill="#111111" stroke="#222222" stroke-width="1" />
        <text x="12" y="23" fill="#888888" font-size="11">Session limit reached · Resets at 1:40 PM</text>
      </g>
    </g>
  </g>

  <!-- RIGHT CARD: PI EXECUTION (TAGGED IN) -->
  <g transform="translate(666, 184)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <rect width="550" height="380" rx="10" fill="#080808" stroke="#262626" stroke-width="1" />
    
    <!-- Window Header -->
    <rect width="550" height="40" rx="10" fill="#0e0e0e" />
    <rect y="30" width="550" height="10" fill="#0e0e0e" />
    <line x1="0" y1="40" x2="550" y2="40" stroke="#1a1a1a" stroke-width="1" />

    <circle cx="18" cy="20" r="3.5" fill="#333333" />
    <circle cx="30" cy="20" r="3.5" fill="#333333" />
    <circle cx="42" cy="20" r="3.5" fill="#333333" />

    <text x="60" y="24" fill="#ededed" font-size="11" font-weight="600">pi · interactive session</text>
    
    <!-- State badge -->
    <rect x="444" y="10" width="92" height="20" rx="4" fill="#1c1c1c" stroke="#333333" stroke-width="1" />
    <text x="458" y="23.5" fill="#ededed" font-size="10" font-weight="600">TAGGED IN</text>

    <!-- Content -->
    <g transform="translate(24, 64)">
      <!-- Command line -->
      <text fill="#555555" font-size="10" letter-spacing="0.5">COMMAND</text>
      <text y="20" fill="#ededed" font-size="12">> /tagteam latest</text>

      <!-- Divider line -->
      <line x1="0" y1="36" x2="502" y2="36" stroke="#171717" stroke-width="1" />

      <!-- Ingest summary block -->
      <g transform="translate(0, 54)">
        <text fill="#555555" font-size="10" letter-spacing="0.5">HANDOFF BRIEF INGESTED</text>
        
        <g transform="translate(0, 14)">
          <rect width="502" height="120" rx="4" fill="#0d0d0d" stroke="#1f1f1f" stroke-width="1" />
          <text x="14" y="26" fill="#ededed" font-size="11">✓ Ingested goal and stopping point</text>
          <text x="14" y="48" fill="#888888" font-size="11">✓ Salvaged worktree: agent-afd3e361dfa64</text>
          <text x="14" y="70" fill="#888888" font-size="11">✓ Reconnected 2 subagent checkpoints</text>
          <text x="14" y="92" fill="#888888" font-size="11">✓ Ingested 11 modified files with zero token bloat</text>
        </g>
      </g>

      <!-- Live turn status -->
      <g transform="translate(0, 210)">
        <text fill="#555555" font-size="10" letter-spacing="0.5">CURRENT TURN</text>
        
        <g transform="translate(0, 14)">
          <rect width="502" height="54" rx="4" fill="#0d0d0d" stroke="#262626" stroke-width="1" />
          <text x="14" y="22" fill="#ededed" font-size="11">pi: "Applying migration and finishing recovery routes..."</text>
          <text x="14" y="40" fill="#555555" font-size="11">238/238 tests passing (100% green)</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Footer Info -->
  <g transform="translate(64, 596)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#444444">
    <text>supports claude code · codex · git worktrees · subagents</text>
    <text x="1152" text-anchor="end">github.com/bharath31/pi-tagteam</text>
  </g>
</svg>
