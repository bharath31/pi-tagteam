<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" style="background:#000000;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="vBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#262626" />
      <stop offset="50%" stop-color="#404040" />
      <stop offset="100%" stop-color="#262626" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="220" fill="#000000" />
  
  <!-- Subtle Outer Border -->
  <rect x="0.5" y="0.5" width="999" height="219" fill="none" stroke="#1f1f1f" stroke-width="1" />

  <!-- Left Content -->
  <g transform="translate(48, 44)">
    <!-- Eyebrow Pill -->
    <g transform="translate(0, 0)">
      <rect width="104" height="22" rx="11" fill="#111111" stroke="#262626" stroke-width="1" />
      <circle cx="10" cy="11" r="3" fill="#ededed" />
      <text x="20" y="15" fill="#888888" font-size="10" font-weight="600" letter-spacing="0.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">PI-PACKAGE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="56" fill="#ededed" font-size="30" font-weight="600" letter-spacing="-0.8">
      pi-tagteam
    </text>

    <!-- Subtitle -->
    <text x="0" y="84" fill="#888888" font-size="13" font-weight="400" letter-spacing="-0.2">
      Pass the baton to Pi when Claude Code or Codex hits rate limits.
    </text>
    <text x="0" y="104" fill="#555555" font-size="12" font-weight="400">
      Recovers dirty worktrees, running subagents, and session memory.
    </text>

    <!-- Supported Chips -->
    <g transform="translate(0, 126)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10">
      <text fill="#444444">supports</text>
      <text x="56" fill="#777777">claude code</text>
      <text x="138" fill="#333333">·</text>
      <text x="150" fill="#777777">codex</text>
      <text x="194" fill="#333333">·</text>
      <text x="206" fill="#777777">git worktrees</text>
      <text x="296" fill="#333333">·</text>
      <text x="308" fill="#777777">subagents</text>
    </g>
  </g>

  <!-- Right Terminal Snippet Box (Vercel Style) -->
  <g transform="translate(620, 36)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <rect width="332" height="148" rx="8" fill="#080808" stroke="#222222" stroke-width="1" />
    
    <!-- Window Bar -->
    <line x1="0" y1="28" x2="332" y2="28" stroke="#171717" stroke-width="1" />
    <circle cx="14" cy="14" r="3.5" fill="#2a2a2a" />
    <circle cx="26" cy="14" r="3.5" fill="#2a2a2a" />
    <circle cx="38" cy="14" r="3.5" fill="#2a2a2a" />
    <text x="54" y="18" fill="#555555" font-size="11">bash</text>

    <!-- Commands inside terminal -->
    <g transform="translate(16, 44)">
      <text x="0" y="14" fill="#555555" font-size="11">$</text>
      <text x="14" y="14" fill="#ededed" font-size="11">pi install npm:pi-tagteam</text>

      <text x="0" y="42" fill="#555555" font-size="11">$</text>
      <text x="14" y="42" fill="#ededed" font-size="11">pi</text>

      <g transform="translate(0, 58)">
        <text x="0" y="16" fill="#888888" font-size="11">> /tagteam latest</text>
        <text x="0" y="34" fill="#ededed" font-size="10">✓ Ingested session (11 dirty files, 2 subagents)</text>
      </g>
    </g>
  </g>
</svg>
