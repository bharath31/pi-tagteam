<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" style="background:#090d16;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'JetBrains Mono',monospace;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.2" />
    </linearGradient>
    <pattern id="bGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <rect width="1000" height="280" fill="url(#bgGrad)" />
  <rect width="1000" height="280" fill="url(#bGrid)" />
  
  <line x1="0" y1="279" x2="1000" y2="279" stroke="url(#glowLine)" stroke-width="2" />

  <!-- Logo & Titles -->
  <g transform="translate(50, 45)">
    <!-- Header Badges -->
    <rect x="0" y="0" width="96" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="8" y="15" fill="#38bdf8" font-size="10" font-weight="700">PI-EXTENSION</text>

    <rect x="104" y="0" width="80" height="22" rx="4" fill="#172554" stroke="#1e40af" stroke-width="1" />
    <text x="112" y="15" fill="#60a5fa" font-size="10" font-weight="700">HANDOFF</text>

    <!-- Main Title -->
    <text x="0" y="65" fill="#f8fafc" font-size="36" font-weight="900" letter-spacing="-0.5">
      pi-tagteam <tspan fill="#f59e0b">🤝</tspan>
    </text>

    <!-- Description -->
    <text x="0" y="94" fill="#cbd5e1" font-size="14" font-weight="500">
      Tag Pi in when Claude Code or OpenAI Codex hits usage limits or crashes.
    </text>
    <text x="0" y="116" fill="#94a3b8" font-size="13">
      Zero-loss transfer of dirty worktrees, running subagents, and session memory.
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="130" height="26" rx="6" fill="#1e293b" />
      <text x="10" y="17" fill="#e06c4b" font-size="11" font-weight="700">⚡ Claude Code</text>

      <rect x="138" y="0" width="140" height="26" rx="6" fill="#1e293b" />
      <text x="148" y="17" fill="#10a37f" font-size="11" font-weight="700">⚡ OpenAI Codex</text>

      <rect x="286" y="0" width="130" height="26" rx="6" fill="#1e293b" />
      <text x="296" y="17" fill="#f59e0b" font-size="11" font-weight="700">⚡ Git Worktrees</text>

      <rect x="424" y="0" width="120" height="26" rx="6" fill="#1e293b" />
      <text x="434" y="17" fill="#c084fc" font-size="11" font-weight="700">⚡ Subagents</text>
    </g>
  </g>

  <!-- Right Side: Terminal Command Snippet Box -->
  <g transform="translate(620, 45)">
    <rect width="330" height="185" rx="10" fill="#0c1220" stroke="#334155" stroke-width="1.2" />
    <rect width="330" height="30" rx="10" fill="#11192d" />
    <rect y="20" width="330" height="10" fill="#11192d" />
    
    <circle cx="16" cy="15" r="4" fill="#ef4444" opacity="0.8" />
    <circle cx="28" cy="15" r="4" fill="#f59e0b" opacity="0.8" />
    <circle cx="40" cy="15" r="4" fill="#10b981" opacity="0.8" />
    <text x="56" y="19" fill="#94a3b8" font-size="11" font-weight="600">terminal — pi</text>

    <!-- Commands in Box -->
    <g transform="translate(16, 48)">
      <text x="0" y="16" fill="#64748b" font-size="11"># Install in Pi</text>
      <text x="0" y="34" fill="#38bdf8" font-size="12" font-weight="700">pi install npm:pi-tagteam</text>

      <line x1="0" y1="48" x2="298" y2="48" stroke="#1e293b" stroke-width="1" />

      <text x="0" y="68" fill="#64748b" font-size="11"># Pass the baton inside Pi</text>
      <text x="0" y="86" fill="#f59e0b" font-size="13" font-weight="700">/tagteam latest</text>

      <text x="0" y="112" fill="#10b981" font-size="11">✓ Ingested 11 modified files</text>
      <text x="0" y="128" fill="#10b981" font-size="11">✓ Reconnected 2 subagents</text>
    </g>
  </g>
</svg>
